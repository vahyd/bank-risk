<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BankRisk — AI Banking Platform</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside>
    <div class="logo"><i>BR</i><span><b>BankRisk</b><small>AI BANKING OS</small></span></div>
    <nav>
      <button class="active" data-page="Overview">◎ <span>Overview</span></button>
      <button data-page="RM Copilot">☰ <span>RM Copilot</span></button>
      <button data-page="Credit Underwriting">✓ <span>Credit Underwriting</span></button>
      <button data-page="Early Warning">▲ <span>Early Warning</span></button>
      <button data-page="Treasury">◇ <span>Treasury</span></button>
      <button data-page="Portfolio Risk">▣ <span>Portfolio Risk</span></button>
      <button data-page="Stress Testing">▤ <span>Stress Testing</span></button>
      <button data-page="CFO AI">✦ <span>CFO AI</span></button>
      <button data-page="AML">◈ <span>AML</span></button>
      <button data-page="Digital Partners">◇ <span>Digital Partners</span></button>
      <button data-page="Dataset">◧ <span>Dataset</span></button>
    </nav>
    <div class="side-note">
      <small>SYSTEM STATUS</small>
      <b>Operational</b>
      <p>Internal use only · Production</p>
      <div><i style="width:98%"></i></div>
      <span>AI models · v2.4 · 98% uptime</span>
    </div>
    <div class="user"><i>RO</i><span><b>Risk Officer</b><small>Internal use only</small></span></div>
  </aside>
  <main>
    <header>
      <button class="menu">☰</button>
      <div class="project"><span>PLATFORM</span><b>BankRisk — AI Banking Operating System</b><small>Commercial lending lifecycle · Internal use only</small></div>
      <div class="actions"><button class="primary" data-action="newcase">＋ New credit case</button></div>
    </header>
    <section id="view"></section>
  </main>
</div>

<div class="chat-wrap">
  <div class="chat-panel" id="chatPanel">
    <div class="chat-head">
      <div><b>BankRisk Copilot</b><small>AI agent team · live</small></div>
      <button class="chat-close" id="chatClose">✕</button>
    </div>
    <div class="chat-body" id="chatBody"></div>
    <div class="chat-suggestions" id="chatSuggestions"></div>
    <div class="chat-input">
      <input id="chatInput" type="text" placeholder="Ask a question… e.g. risk for Delta Foods?" autocomplete="off">
      <button id="chatSend">Send</button>
    </div>
  </div>
  <button class="chat-tab" id="chatTab">✦ <span>Ask the agent team</span> <span class="badge">AI</span></button>
</div>

<script src="app.js"></script>
</body>
</html>
